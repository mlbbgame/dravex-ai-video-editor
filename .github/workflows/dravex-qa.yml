name: DRAVEX QA — mobile browser smoke tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dravex-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Build and test mobile browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and type-check
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Ensure ffmpeg for long-video fixture
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Run DRAVEX browser smoke tests
        run: npm run test:qa

      - name: Extract review frames from actual montage exports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/exported-video-frames
          shopt -s nullglob
          for video in test-results/exported-videos/*.webm; do
            name="$(basename "${video%.webm}")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
            if [[ -z "$duration" ]]; then
              echo "Could not read duration for $video" >&2
              continue
            fi
            for point in 0 0.5 0.9; do
              timestamp="$(awk -v d="$duration" -v p="$point" 'BEGIN { t=d*p; if (t<0) t=0; if (t>d-0.1) t=(d>0.1 ? d-0.1 : 0); printf "%.3f", t }')"
              ffmpeg -hide_banner -loglevel error -y -ss "$timestamp" -i "$video" -frames:v 1 -vf "scale=320:-2" "test-results/exported-video-frames/${name}-${point}.png" || echo "Frame extraction failed: $video at $timestamp" >&2
            done
          done
          find test-results/exported-video-frames -maxdepth 1 -type f -print
          video_count="$(find test-results/exported-videos -maxdepth 1 -type f -name '*.webm' | wc -l)"
          frame_count="$(find test-results/exported-video-frames -maxdepth 1 -type f -name '*.png' | wc -l)"
          {
            echo "## DRAVEX visual export review"
            echo "- Exported WebM files found: $video_count"
            echo "- Review PNG frames extracted: $frame_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$video_count" -gt 0 && "$frame_count" -eq 0 ]]; then
            echo "Exported videos exist, but no review frames could be extracted." >&2
            exit 1
          fi

      - name: Upload actual montage exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-exported-video-samples
          path: |
            test-results/exported-videos/
            test-results/exported-video-frames/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
