name: DRAVEX QA — mobile browser smoke tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dravex-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Build and test mobile browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and type-check
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run DRAVEX browser smoke tests
        run: npm run test:qa

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
