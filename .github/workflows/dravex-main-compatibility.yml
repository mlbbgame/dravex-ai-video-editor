name: DRAVEX main-branch compatibility QA

on:
  push:
    branches:
      - "feature/dravex-main-compatibility-audit"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dravex-main-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Build and test main-based editor flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and type-check
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Ensure ffmpeg for media fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Run compatibility tests
        run: npm run test:qa
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-main-compatibility-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
