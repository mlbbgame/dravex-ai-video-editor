name: Deploy DRAVEX primary site and compatibility preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current primary DRAVEX site source
        uses: actions/checkout@v4
        with:
          ref: feature/dravex-camera-audio-v2
          path: app-source

      - name: Check out isolated compatibility test build
        uses: actions/checkout@v4
        with:
          ref: feature/dravex-main-compatibility-audit
          path: preview-source

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install primary site dependencies
        working-directory: app-source
        run: npm install --no-audit --no-fund

      - name: Build primary DRAVEX site (unchanged source)
        working-directory: app-source
        run: npm run build

      - name: Place primary site at repository root
        run: |
          mkdir -p dist
          cp -R app-source/dist/. dist/

      - name: Install preview dependencies
        working-directory: preview-source
        run: npm install --no-audit --no-fund

      - name: Build isolated compatibility preview
        working-directory: preview-source
        run: npm run build -- --base=/dravex-ai-video-editor/preview/

      - name: Add compatibility preview under /preview/
        run: |
          mkdir -p dist/preview
          cp -R preview-source/dist/. dist/preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy DRAVEX site and isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
