name: Deploy DRAVEX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install main dependencies
        run: npm install --no-audit --no-fund
      - name: Build main site
        run: npm run build
      # Keep the redesign isolated under /preview/ until Android smoke tests pass.
      - name: Check out DRAVEX preview branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/one-button-auto-montage
          path: preview-source
      - name: Install preview dependencies
        working-directory: preview-source
        run: npm install --no-audit --no-fund
      - name: Build preview site
        working-directory: preview-source
        run: npm run build -- --base=/dravex-ai-video-editor/preview/
      - name: Add preview under /preview/
        run: |
          mkdir -p dist/preview
          cp -R preview-source/dist/. dist/preview/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
