name: Deploy DRAVEX primary site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DRAVEX app (the intended preview version)
        uses: actions/checkout@v4
        with:
          ref: feature/dravex-camera-audio-v2
          path: app-source

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install DRAVEX dependencies
        working-directory: app-source
        run: npm install --no-audit --no-fund

      # Publish DRAVEX Music Studio: curated CC0 tracks for Phonk/Drift, Anime/Jumpstyle, Slowed/Dark, TikTok/Shorts, Gaming, Cinematic, Electronic and Chill; one-tap apply, style filters, mobile QA
      # at the main URL, while preserving /preview/ as an identical compatibility URL.
      - name: Build primary DRAVEX site
        working-directory: app-source
        run: npm run build

      - name: Place primary site at repository root
        run: |
          mkdir -p dist
          cp -R app-source/dist/. dist/

      - name: Build /preview/ compatibility alias
        working-directory: app-source
        run: npm run build -- --base=/dravex-ai-video-editor/preview/

      - name: Add preview alias
        run: |
          mkdir -p dist/preview
          cp -R app-source/dist/. dist/preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy DRAVEX primary site
        id: deployment
        uses: actions/deploy-pages@v4
