name: DRAVEX automatic quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dravex-auto-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    name: Build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and production build
        run: npm run build

      - name: Install Chromium when browser tests exist
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:qa'] ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          else
            echo "No test:qa script on this revision; browser QA is skipped."
          fi

      - name: Run browser QA when available
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:qa'] ? 0 : 1)"; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            npm run test:qa
          else
            echo "No test:qa script on this revision; build check completed."
          fi

      - name: Extract review frames from actual montage exports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/dravex-review-frames
          shopt -s nullglob
          video_count=0
          frame_count=0
          for video in test-results/dravex-*.webm; do
            video_count=$((video_count + 1))
            name="$(basename "${video%.webm}")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video" 2>/dev/null || true)"
            if [[ ! "$duration" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk -v d="$duration" 'BEGIN { exit !(d > 0) }'; then
              echo "Could not read a positive finite duration for $video (got: $duration)" >&2
              exit 1
            fi
            if [[ ! -s "$video" ]]; then
              echo "Exported video is empty: $video" >&2
              exit 1
            fi
            video_stream="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "$video" 2>/dev/null || true)"
            if [[ -z "$video_stream" ]]; then
              echo "No readable video stream in $video" >&2
              exit 1
            fi
            video_codec="$(printf '%s' "$video_stream" | cut -d, -f1)"
            video_width="$(printf '%s' "$video_stream" | cut -d, -f2)"
            video_height="$(printf '%s' "$video_stream" | cut -d, -f3)"
            if [[ -z "$video_codec" || ! "$video_width" =~ ^[0-9]+$ || ! "$video_height" =~ ^[0-9]+$ ]] || (( video_width <= 0 || video_height <= 0 )); then
              echo "Invalid video codec or dimensions in $video: $video_stream" >&2
              exit 1
            fi
            echo "Validated $video: duration=${duration}s, codec=$video_codec, ${video_width}x${video_height}"
            for point in 0 0.5 0.9; do
              timestamp="$(awk -v d="$duration" -v p="$point" 'BEGIN { t=d*p; if (t<0) t=0; if (t>d-0.1) t=(d>0.1 ? d-0.1 : 0); printf "%.3f", t }')"
              if ffmpeg -hide_banner -loglevel error -y -ss "$timestamp" -i "$video" -frames:v 1 -vf "scale=320:-2" "test-results/dravex-review-frames/${name}-${point}.png"; then
                frame_count=$((frame_count + 1))
              else
                echo "Frame extraction failed: $video at $timestamp" >&2
              fi
            done
          done
          {
            echo "## DRAVEX visual export review"
            echo "- Exported WebM files found: $video_count"
            echo "- Review PNG frames extracted: $frame_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$video_count" -gt 0 && "$frame_count" -lt "$video_count" ]]; then
            echo "Expected at least one review frame per exported video, but extracted $frame_count frames for $video_count videos." >&2
            exit 1
          fi

      - name: Upload representative rendered videos and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-rendered-samples
          path: |
            test-results/dravex-*.webm
            test-results/dravex-review-frames/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dravex-browser-qa-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
